# lec.libraengine.com -- server block for the host nginx (RC's nginx container,
# the only thing binding :80/:443 on le-projects-01). Add this to that nginx:
# mount this file into the nginx container's conf.d (a volume line on RC's
# nginx service) OR append it to RC's deploy/nginx.conf, then reload. It proxies
# the public domain to the lec container over the shared `le-proxy` network.
#
# External clients (Lyric Transformer, future chargers) hit this. RC's own calls
# stay internal (http://lec:8012) and never touch this block.

server {
    listen 80;
    listen [::]:80;
    server_name lec.libraengine.com;

    # ACME http-01 challenge for the shared certbot (certbot-webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lec.libraengine.com;

    ssl_certificate     /etc/letsencrypt/live/lec.libraengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lec.libraengine.com/privkey.pem;

    # A calibration is a multi-second Opus call; without a raised read timeout
    # nginx would 504 before the score returns. LT's /api/score fetch is slow by
    # nature -- give it real headroom.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    client_max_body_size  256k;   # artifacts are text; cap abuse

    location / {
        proxy_pass http://lec:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
