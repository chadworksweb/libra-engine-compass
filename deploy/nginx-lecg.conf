# lecg.libraengine.com -- server block for the host nginx (le-nginx at
# /root/proxy/, the only thing binding :80/:443 on le-projects-01). It serves
# the Libra Engine Compass GOVERNANCE venue (the lecg- app, Decoupling Part 2)
# and proxies to the lecg container over the shared le-proxy network.
#
# Install on the server exactly like lec.conf: copy to
# /root/proxy/nginx/conf.d/lecg.conf, issue the cert via le-certbot, then
# `docker exec le-nginx nginx -t && docker exec le-nginx nginx -s reload`.
#
# Cut 1 is read-only + public (GET /api/constitution, /api/constitution/version,
# /health). No service-key gate -- the constitution is public. The LE site UI on
# libraengine.com fetches this cross-origin (CORS allow-list is in lecg_main.py).

server {
    listen 80;
    listen [::]:80;
    server_name lecg.libraengine.com;

    # ACME http-01 challenge for the shared certbot (certbot-webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lecg.libraengine.com;

    ssl_certificate     /etc/letsencrypt/live/lecg.libraengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lecg.libraengine.com/privkey.pem;

    # Governance serves static JSON (no Opus call), so default timeouts are ample.
    client_max_body_size  256k;

    location / {
        proxy_pass http://lecg:8014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
