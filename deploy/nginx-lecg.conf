# Libra Engine Compass Governance -- lecg.libraengine.com -> lecg-backend
# (le-proxy alias `lecg`). The host proxy le-nginx (/root/proxy/) serves this;
# install at /root/proxy/nginx/conf.d/lecg.conf, issue the cert via le-certbot,
# then `docker exec le-nginx nginx -t && docker exec le-nginx nginx -s reload`.
# Mirrors the live lec.conf (ssl-common include + security headers), with two
# differences: it proxies the governance container (lecg:8014), and it does NOT
# set X-Robots-Tag noindex -- the tenets page is public and meant to be indexed.
#
# Cut 1 is read-only + public (the tenets page + /api/constitution). No
# service-key gate; the LE site / RC may fetch /api/constitution cross-origin
# (CORS allow-list is in lecg_main.py).

server {
    listen 80;
    server_name lecg.libraengine.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name lecg.libraengine.com;

    ssl_certificate /etc/letsencrypt/live/lecg.libraengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lecg.libraengine.com/privkey.pem;
    include /etc/nginx/ssl-common.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 256k;

    location / {
        proxy_pass http://lecg:8014;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
