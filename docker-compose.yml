# Libra Engine Compass -- production compose. Runs ONE service (the lec backend)
# on the same droplet (le-projects-01) as Rising Compass. It does NOT run its
# own nginx/certbot: the host nginx (RC's, the only thing binding 80/443) serves
# lec.libraengine.com via the server block in deploy/nginx-lec.conf and proxies
# to this container over the shared external `le-proxy` network.
#
# Env is substituted from a root-level .env next to this file
# (/root/libra-engine-compass/.env on the server); the container reads the real
# env vars, which pydantic-settings prefers over backend/.env. See deploy/DEPLOY.md.
services:
  lec:
    build: ./backend
    container_name: lec-backend
    networks:
      default:
      le-proxy:
        aliases:
          - lec            # RC + LT reach scoring at http://lec:8012 (internal)
    # Internal only -- the host nginx proxies to it over le-proxy. Bound to
    # localhost so the port is reachable on the droplet for debugging but never
    # exposed publicly.
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - lec-data:/app/data     # sqlite fallback only; prod uses the Postgres DSN
    environment:
      # --- Anthropic (LEC's own workspace key) ---
      - LEC_ANTHROPIC_API_KEY=${LEC_ANTHROPIC_API_KEY}
      - LEC_AGENT_MODEL=${LEC_AGENT_MODEL:-claude-opus-4-6}
      - LEC_ESCALATION_MODEL=${LEC_ESCALATION_MODEL:-}
      - LEC_ESCALATION_REPASS_ENABLED=${LEC_ESCALATION_REPASS_ENABLED:-false}
      - LEC_ESCALATION_CONFIDENCE_FLOOR=${LEC_ESCALATION_CONFIDENCE_FLOOR:-0.6}
      # --- LEC's own DB (dedicated libra_engine_compass on the shared DO cluster,
      #     via the PgBouncer pool, port 25061) ---
      - LEC_DATABASE_URL=${LEC_DATABASE_URL}
      # --- Service-key auth on /api/score (X-Api-Key). TRUE in prod once keys
      #     are issued (deploy/issue_key.py). ---
      - LEC_AUTH_REQUIRED=${LEC_AUTH_REQUIRED:-true}
      # --- Admin console (obscured login + signed cookie). ALL FOUR required
      #     or the panel 404s. ---
      - LEC_ADMIN_LOGIN_TOKEN=${LEC_ADMIN_LOGIN_TOKEN}
      - LEC_ADMIN_USERNAME=${LEC_ADMIN_USERNAME}
      - LEC_ADMIN_PASSWORD=${LEC_ADMIN_PASSWORD}
      - LEC_ADMIN_SECRET=${LEC_ADMIN_SECRET}
      - LEC_ADMIN_SESSION_HOURS=${LEC_ADMIN_SESSION_HOURS:-12}
      # --- Decoupling cutover (Part 1). Dark by default; flip to true in the
      #     root .env to score the lyric path through gospel + rc-lyric. The
      #     container reads ONLY the vars listed here, so the flag must be
      #     forwarded explicitly (not just set in .env). Fail-closed in the
      #     calibrator. ---
      - LEC_COMPOSE_RUBRIC=${LEC_COMPOSE_RUBRIC:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8012/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The Compass GOVERNANCE venue (lecg-) -- the second app (Decoupling Part 2,
  # Decision 4). Same image as lec, different ASGI app. Cut 1 is READ-ONLY +
  # PUBLIC: serves the canonical constitution from the le-baseline files baked
  # into the image -- no Anthropic key, no admin, no DB, no auth. The host nginx
  # serves lecg.libraengine.com (deploy/nginx-lecg.conf) and proxies here over
  # le-proxy. Cut 2 adds the write surfaces (shared Clerk + a governance DB) and
  # their env. Kept a SEPARATE service from lec so the instrument/venue seam holds.
  lecg:
    build: ./backend
    container_name: lecg-backend
    command: ["uvicorn", "governance.lecg_main:app", "--host", "0.0.0.0", "--port", "8014"]
    networks:
      default:
      le-proxy:
        aliases:
          - lecg           # the LE site UI reaches the governance API via lecg.libraengine.com
    ports:
      - "127.0.0.1:8014:8014"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8014/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  le-proxy:
    external: true

volumes:
  lec-data:
